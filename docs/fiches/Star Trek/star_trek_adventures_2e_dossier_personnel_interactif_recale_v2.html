function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(STORAGE,JSON.stringify(pack()));$('#saveStatus').textContent='Sauvegardé';setTimeout(()=>$('#saveStatus').textContent='Sauvegarde auto',1000)}catch(e){$('#saveStatus').textContent='Stockage indisponible'}},100)}
document.addEventListener('input',save);document.addEventListener('change',save);
try{const o=JSON.parse(localStorage.getItem(STORAGE)||'null');if(o)apply(o)}catch(e){}
$('#export').onclick=()=>{const p=pack(),a=document.createElement('a'),b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download=((p.data['identity.name']||'personnage-star-trek')+'').replace(/[^a-z0-9_-]+/gi,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.format&&o.format!=='interactive-character-sheet')throw 0;apply(o);save()}catch(_e){alert('Fichier JSON invalide ou incompatible.')}e.target.value=''};
$('#zones').onclick=()=>{$('#sheet').classList.toggle('zones');$('#zones').textContent=$('#sheet').classList.contains('zones')?'Masquer les zones':'Zones'};
$('#reset').onclick=()=>{if(confirm('Effacer toutes les données de cette fiche ?')){localStorage.removeItem(STORAGE);$$('[data-key]').forEach(el=>el.type==='checkbox'?el.checked=false:el.value='')}};
$('#print').onclick=()=>window.print();
let zoom=1;
function setZoom(v){zoom=Math.max(.2,Math.min(4,v));document.documentElement.style.setProperty('--scale',zoom);$('#zoomReadout').textContent=Math.round(zoom*100)+'%'}
function fit(){const t=document.querySelector('.toolbar'),mw=Math.max(260,innerWidth-32),mh=Math.max(260,innerHeight-t.offsetHeight-32);setZoom(Math.min(4,Math.max(.2,Math.min(mw/612,mh/792))));}
$('#zoomOut').onclick=()=>setZoom(zoom-.1);$('#zoomIn').onclick=()=>setZoom(zoom+.1);$('#fit').onclick=fit;
addEventListener('keydown',e=>{if(!e.ctrlKey)return;if(e.key==='+'||e.key==='='){e.preventDefault();setZoom(zoom+.1)}else if(e.key==='-'){e.preventDefault();setZoom(zoom-.1)}else if(e.key==='0'){e.preventDefault();fit()}});
addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(zoom+(e.deltaY<0?.1:-.1))},{passive:false});
fit();
</script>
</body>
</html>
