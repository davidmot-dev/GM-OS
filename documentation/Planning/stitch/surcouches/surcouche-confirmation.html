<!DOCTYPE html>

<html class="h-full bg-slate-950" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GM-OS // Cadre Modal de Confirmation</title>
<!-- Tailwind CSS CDN avec plugins container-queries et forms -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#0f172a',
            deep: '#020617',
            edge: '#1e293b',
            accentCyan: '#06b6d4',
            alertRed: '#ef4444',
            alertAmber: '#f59e0b',
            textMuted: '#898c95',
          },
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
          }
        }
      }
    }
  </script>
<!-- Google Fonts: Orbitron, Inter & Space Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Orbitron:wght@600;700;800;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<!-- Styles personnalisés pour le respect strict du thème diégétique cyberpunk -->
<style data-purpose="diegetic-theme">
    /* Forcer l'absence totale d'arrondi selon les spécifications cyberpunk brutal */
    * {
      border-radius: 0px !important;
    }
    
    /* Halo néon actif sur le focus de sécurité */
    .focus-security-halo {
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.45), inset 0 0 4px rgba(6, 182, 212, 0.2);
    }

    /* Ombrage profond du panneau modal */
    .modal-shadow {
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), 0 0 0 1px #020617;
    }

    /* Scanline subtile en arrière-plan d'interface */
    .scanline-bg {
      background: linear-gradient(
        rgba(15, 23, 42, 0.96) 50%, 
        rgba(10, 15, 30, 0.98) 50%
      );
      background-size: 100% 4px;
    }
  </style>
</head>
<body class="h-full w-full m-0 p-0 font-inter text-slate-100 overflow-hidden relative select-none">
<!-- BEGIN: BlurredCockpitBackground -->
<!-- Arrière-plan simulant l'application GM-OS sous-jacente en état flouté/assombri -->
<div aria-hidden="true" class="absolute inset-0 z-0 bg-[#020617]/85 backdrop-blur-md flex flex-col justify-between p-6 pointer-events-none">
<!-- Fausse barre supérieure cockpit -->
<div class="flex items-center justify-between border-b border-edge/60 pb-4 opacity-40">
<div class="flex items-center gap-3">
<div class="w-3 h-3 bg-cyan-500"></div>
<span class="font-orbitron font-bold tracking-widest text-xs text-slate-400">GM-OS // CONSOLE V4.2.1</span>
</div>
<div class="text-xs font-mono text-slate-500 tracking-wider">CANAL: TACTIQUE DIRECTE</div>
</div>
<!-- Faux contenu en arrière-plan -->
<div class="grid grid-cols-3 gap-6 opacity-25">
<div class="border border-edge p-5 bg-surface/30 h-64"></div>
<div class="border border-edge p-5 bg-surface/30 h-64"></div>
<div class="border border-edge p-5 bg-surface/30 h-64"></div>
</div>
<!-- Fausse barre d'état basse -->
<div class="border-t border-edge/40 pt-3 flex justify-between text-xs font-mono text-slate-600 opacity-40">
<span>SYNCHRO : ACTIVE</span>
<span>SECTEUR 07</span>
</div>
</div>
<!-- END: BlurredCockpitBackground -->
<!-- BEGIN: ModalOverlayWrapper -->
<!-- Centrage strict de la boîte de dialogue modale -->
<div class="relative z-10 flex min-h-full items-center justify-center p-4">
<!-- BEGIN: ConfirmationModalWindow -->
<!-- Conteneur principal de largeur stricte (500px), arêtes vives et structure brutaliste -->
<aside aria-describedby="dialog-description" aria-labelledby="dialog-title" aria-modal="true" class="w-full max-w-[500px] bg-surface scanline-bg border border-edge modal-shadow text-slate-100 flex flex-col" data-purpose="confirmation-modal" role="alertdialog">
<!-- BEGIN: ModalHeader -->
<header class="flex items-stretch justify-between border-b border-edge bg-deep/90 select-none">
<!-- Bloc titre et pictogramme d'alerte -->
<div class="flex items-center">
<!-- Caisson pictogramme d'alerte orange/ambre brutal -->
<div class="w-12 h-12 flex items-center justify-center bg-amber-500/10 border-r border-edge text-amber-500 shrink-0" data-purpose="alert-icon-box">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" stroke-linecap="square" stroke-linejoin="miter"></path>
</svg>
</div>
<!-- Titulature de la modale -->
<div class="px-4 py-2 flex flex-col justify-center">
<h2 class="font-orbitron font-bold text-base tracking-wider uppercase text-slate-100 leading-none" id="dialog-title">
              Confirmation
            </h2>
<span class="font-mono text-[11px] text-textMuted tracking-tight mt-1">
              // DIALOGUE SÉCURISÉ
            </span>
</div>
</div>
<!-- Bouton Fermeture [X] -->
<div class="flex items-center pr-2">
<button aria-label="Fermer" class="h-9 px-3 flex items-center gap-1.5 border border-edge/80 hover:border-slate-400 bg-surface hover:bg-slate-800 text-textMuted hover:text-white transition-colors cursor-pointer group" title="Fermer la fenêtre (Échap)" type="button">
<span class="font-orbitron font-bold text-xs uppercase leading-none">X</span>
<span class="font-mono text-[11px] text-slate-500 group-hover:text-slate-300 hidden sm:inline">[ÉCHAP]</span>
</button>
</div>
</header>
<!-- END: ModalHeader -->
<!-- BEGIN: ModalBody -->
<section class="p-6 bg-surface/70" data-purpose="dialog-content">
<!-- Message principal de confirmation dimensionné pour lecture à distance -->
<p class="text-[15px] leading-relaxed text-slate-300 font-inter">
          Supprimer le PNJ <strong class="font-semibold text-slate-50 tracking-wide">« Roy Batty »</strong> ?
        </p>
<!-- Alerte irréversible -->
<div class="mt-4 pt-3 border-t border-edge/50 flex items-start gap-2 text-textMuted text-[13px] leading-normal font-inter">
<span class="text-amber-500 font-bold shrink-0">■</span>
<span>Cette action est définitive et ne s'annule pas sur le réseau actif.</span>
</div>
</section>
<!-- END: ModalBody -->
<!-- BEGIN: ModalFooter -->
<footer class="border-t border-edge bg-deep/80 px-5 py-4 flex items-center justify-end gap-3 select-none" data-purpose="dialog-actions">
<!-- Bouton Annuler avec focus actif par défaut (sécurité anti-frappe réflexe) -->
<button autofocus="" class="h-11 px-6 border-2 border-accentCyan text-white bg-slate-900/90 font-orbitron font-bold text-[13px] tracking-wider uppercase transition-all duration-150 focus-security-halo hover:bg-accentCyan/10 cursor-pointer flex items-center justify-center gap-2" data-purpose="action-cancel-focus" type="button">
<span class="w-1.5 h-1.5 bg-accentCyan"></span>
<span>Annuler</span>
</button>
<!-- Bouton Destructeur Supprimer -->
<button class="h-11 px-6 bg-alertRed hover:bg-red-600 active:bg-red-700 text-slate-950 font-orbitron font-extrabold text-[13px] tracking-widest uppercase transition-colors cursor-pointer border border-transparent shadow-[0_0_10px_rgba(239,68,68,0.3)] hover:shadow-[0_0_15px_rgba(239,68,68,0.5)] flex items-center justify-center" data-purpose="action-confirm-delete" type="button">
<span>Supprimer</span>
</button>
</footer>
<!-- END: ModalFooter -->
</aside>
<!-- END: ConfirmationModalWindow -->
</div>
<!-- END: ModalOverlayWrapper -->
</body></html>
