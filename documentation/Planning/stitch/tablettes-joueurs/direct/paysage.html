<script>
    // Bascule Mode Performance / Mode Qualité
    let isPerfMode = true;

      isPerfMode = !isPerfMode;
      const btnText = document.getElementById('perfText');
      if (isPerfMode) {
        btnText.textContent = "MODE PERFORMANCE";
      } else {
        btnText.textContent = "MODE QUALITÉ";
