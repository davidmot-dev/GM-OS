<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0e1d1a"/><style>text{font-family:Consolas,monospace;fill:#c6e8c7}</style><path d="M25 100H1175M25 725H1175" stroke="#77aa83" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Canal d’approche</text><text x="55" y="155" font-size="22">Le Vautour annonce son approche. Son transpondeur peut être coupé pour la</text><text x="55" y="187" font-size="22">variante de combat spatial ; négocier reste possible.</text><text x="50" y="765" font-size="16">ALIEN · ORPHÉE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>