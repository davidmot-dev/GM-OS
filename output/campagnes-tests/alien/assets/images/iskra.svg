<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0e1d1a"/><style>text{font-family:Consolas,monospace;fill:#c6e8c7}</style><path d="M25 100H1175M25 725H1175" stroke="#77aa83" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Iskra — équipage de relève</text><text x="55" y="155" font-size="22">Eli Voss : machines et senseurs. Mara Chen : commandement et soins. Samir Hale :</text><text x="55" y="187" font-size="22">pilote. Célian Dorr (PNJ) : artilleur.</text><text x="55" y="350" font-size="22">Récupérer les survivants. Garder une route de retour. Toute cargaison est une</text><text x="55" y="382" font-size="22">décision séparée.</text><text x="50" y="765" font-size="16">ALIEN · ORPHÉE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>