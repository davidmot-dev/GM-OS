<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0e1d1a"/><style>text{font-family:Consolas,monospace;fill:#c6e8c7}</style><path d="M25 100H1175M25 725H1175" stroke="#77aa83" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Mara Chen</text><text x="55" y="150" font-size="22">Officière et médecin</text><text x="55" y="260" font-size="22">Voix posée, carnet clinique fermé par un élastique ; refuse les diagnostics sans</text><text x="55" y="292" font-size="22">témoin.</text><text x="55" y="410" font-size="22">Elle commande le petit équipage d’Iskra et connaît le prix d’une quarantaine mal</text><text x="55" y="442" font-size="22">comprise.</text><text x="50" y="765" font-size="16">ALIEN · ORPHÉE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>