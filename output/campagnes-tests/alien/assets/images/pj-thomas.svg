<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0e1d1a"/><style>text{font-family:Consolas,monospace;fill:#c6e8c7}</style><path d="M25 100H1175M25 725H1175" stroke="#77aa83" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Eli Voss</text><text x="55" y="150" font-size="22">Mécanicien de bord</text><text x="55" y="260" font-size="22">Combinaison usée, gestes économes ; préfère un raccord honnête à un rapport</text><text x="55" y="292" font-size="22">rassurant.</text><text x="55" y="410" font-size="22">Chargé de remettre le relais en service, il a promis à Iona de ramener son</text><text x="55" y="442" font-size="22">équipe.</text><text x="50" y="765" font-size="16">ALIEN · ORPHÉE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>