<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0e1d1a"/><style>text{font-family:Consolas,monospace;fill:#c6e8c7}</style><path d="M25 100H1175M25 725H1175" stroke="#77aa83" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Spécimen d’Orphée</text><text x="55" y="155" font-size="22">Une présence allongée, des griffes sur une cloison ; profil de recette à</text><text x="55" y="187" font-size="22">confirmer par Maman.</text><text x="55" y="330" font-size="22">Un frottement, puis le silence.</text><text x="50" y="765" font-size="16">ALIEN · ORPHÉE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>