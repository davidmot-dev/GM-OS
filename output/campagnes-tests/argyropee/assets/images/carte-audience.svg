<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#eeece6"/><rect x="20" y="20" width="1160" height="760" fill="none" stroke="#25251f" stroke-width="3"/><style>text{font-family:Georgia,serif;fill:#25251f}</style><text x="55" y="77" font-size="32">La salle du Serment-Petit</text><path d="M55 104H1145M55 721H1145" stroke="#25251f" stroke-width="2"/><text x="55" y="160" font-size="22">Petite salle municipale prêtée aux audiences locales, avec entrée publique et pièce</text><text x="55" y="192" font-size="22">d’attente. Les témoins y viennent par choix, pas comme une cargaison.</text><rect x="60" y="330" width="320" height="125" fill="#faf9f5" stroke="#25251f" stroke-width="2"/><text x="78" y="382" font-size="24">Bancs du public</text><path d="M380 390h60" stroke="#25251f" stroke-width="3"/><rect x="440" y="330" width="320" height="125" fill="#faf9f5" stroke="#25251f" stroke-width="2"/><text x="458" y="382" font-size="24">Table de déposition</text><path d="M760 390h60" stroke="#25251f" stroke-width="3"/><rect x="820" y="330" width="320" height="125" fill="#faf9f5" stroke="#25251f" stroke-width="2"/><text x="838" y="382" font-size="24">Pièce d’attente</text><text x="55" y="520" font-size="22">Vers : Le dépôt des copies ; Le refuge du Linge-Blanc ; La loge des Trois-Clefs</text><text x="55" y="645" font-size="22">Schéma original sans échelle. Le Conteur annonce hauteurs, distances et issues avant</text><text x="55" y="677" font-size="22">une action risquée.</text><text x="55" y="758" font-size="15">ARGYROPÉE · LES COMPTES DE LA MARÉE · DOCUMENT ORIGINAL DE RECETTE</text></svg>