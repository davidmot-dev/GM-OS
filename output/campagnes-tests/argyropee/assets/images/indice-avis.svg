<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#eeece6"/><rect x="20" y="20" width="1160" height="760" fill="none" stroke="#25251f" stroke-width="3"/><style>text{font-family:Georgia,serif;fill:#25251f}</style><text x="55" y="77" font-size="32">Avis aux maisons des Sept-Marches</text><path d="M55 104H1145M55 721H1145" stroke="#25251f" stroke-width="2"/><text x="55" y="175" font-size="22">Avis de démolition daté d’avant la visite des experts. Les numéros de maisons sont</text><text x="55" y="207" font-size="22">lisibles ; aucune famille n’est nommée.</text><text x="55" y="610" font-size="22">Pièce de fiction préparée. Les noms privés, les diagnostics et les marqueurs du</text><text x="55" y="642" font-size="22">Conteur sont absents du document public.</text><text x="55" y="758" font-size="15">ARGYROPÉE · LES COMPTES DE LA MARÉE · DOCUMENT ORIGINAL DE RECETTE</text></svg>