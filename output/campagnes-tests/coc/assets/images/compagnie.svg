<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#ede9dd"/><rect width="1200" height="105" fill="#352840"/><style>text{font-family:Arial,sans-serif;fill:#352840}</style><path d="M30 710H1170" stroke="#89522f" stroke-width="5"/><text x="50" y="66" font-size="32" font-weight="700" style="fill:#ede9dd">Trois métiers, une même alerte</text><text x="55" y="180" font-size="22">Sami : vérifier le réseau. Inès : protéger les personnes. Maël : publier des preuves</text><text x="55" y="212" font-size="22">vérifiables.</text><text x="55" y="350" font-size="22">Expertise publique, accord surveillé ou publication : les évidences ne demandent</text><text x="55" y="382" font-size="22">aucun jet.</text><text x="50" y="760" font-size="15">COC2 · LES MINUTES DE VERRE · DOCUMENT ORIGINAL DE RECETTE</text></svg>