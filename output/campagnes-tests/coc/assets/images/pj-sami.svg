<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#ede9dd"/><rect width="1200" height="105" fill="#352840"/><style>text{font-family:Arial,sans-serif;fill:#352840}</style><path d="M30 710H1170" stroke="#89522f" stroke-width="5"/><text x="50" y="66" font-size="32" font-weight="700" style="fill:#ede9dd">Sami Delcourt</text><text x="55" y="160" font-size="22">Technicien des réseaux</text><text x="55" y="260" font-size="22">Veste imperméable, carnet quadrillé, regard attentif aux installations.</text><text x="55" y="420" font-size="22">Sami entretient les capteurs du canal de Belle-Rive. Une alerte impossible porte sa</text><text x="55" y="452" font-size="22">signature numérique.</text><text x="55" y="590" font-size="22">Cartouche documentaire ; profil aux valeurs choisies, pas de budget novice</text><text x="55" y="622" font-size="22">revendiqué.</text><text x="50" y="760" font-size="15">COC2 · LES MINUTES DE VERRE · DOCUMENT ORIGINAL DE RECETTE</text></svg>