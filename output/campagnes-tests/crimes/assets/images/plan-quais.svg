<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f0e8d8"/><rect x="28" y="28" width="1144" height="744" fill="none" stroke="#51483e" stroke-width="2"/><style>text{font-family:Georgia,serif;fill:#292822}</style><text x="55" y="88" font-size="30">Quai des Cordages</text><path d="M55 110H1145" stroke="#51483e"/><text x="55" y="152" font-size="22">Entrepôts et escalier d’eau. Le chargement est visible depuis la berge publique ;</text><text x="55" y="184" font-size="22">entrer dans le hangar est une autre décision.</text><rect x="60" y="370" width="320" height="170" fill="#ded4c3" stroke="#51483e"/><text x="76" y="434" font-size="23">1. Berge</text><rect x="440" y="370" width="320" height="170" fill="#ded4c3" stroke="#51483e"/><text x="456" y="434" font-size="23">2. Hangar</text><rect x="820" y="370" width="320" height="170" fill="#ded4c3" stroke="#51483e"/><text x="836" y="434" font-size="23">3. Escalier d’eau</text><path d="M380 455H440M760 455H820" stroke="#51483e" stroke-width="4"/><text x="55" y="610" font-size="22">Plan schématique sans échelle. Annoncer accès, distances, obstacles et possibilités de</text><text x="55" y="642" font-size="22">retrait ; aucun effet de terrain automatique.</text><text x="55" y="749" font-size="15">CRIMES 2 · LES HEURES RAYÉES · DOCUMENT OU PLAN ORIGINAL DE FICTION</text></svg>
