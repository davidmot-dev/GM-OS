<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="100%" height="100%" fill="#e9e2cf"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183b37} .petit{font-size:19px}.titre{font-size:38px;font-weight:700}</style><rect x="20" y="20" width="1160" height="760" fill="none" stroke="#53766c" stroke-width="3"/><text x="50" y="76" class="titre">Transcription d’un appel impossible</text><text x="55" y="155" class="petit">Ici Saint-Elme. Nous étions douze au départ. Nous sommes treize à</text><text x="55" y="186" class="petit">répondre. N’ouvrez pas la quatrième porte.</text><text x="50" y="764" font-size="15">PORT-LENOIR · FICTION ORIGINALE · CAMPAGNE DE RECETTE GM-OS</text></svg>