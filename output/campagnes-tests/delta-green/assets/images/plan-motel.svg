<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#e4e5dc"/><rect x="20" y="20" width="1160" height="760" fill="none" stroke="#285646" stroke-width="3"/><style>text{font-family:Arial,sans-serif;fill:#182920}</style><text x="50" y="70" font-size="32">Motel des Pins</text><path d="M50 100H1150M50 720H1150" stroke="#285646"/><text x="50" y="155" font-size="22">Un relais routier déserté après une alerte sanitaire. La pluie couvre les bruits de la</text><text x="50" y="187" font-size="22">route. Schéma sans échelle ; issues et distances à préciser avant une action risquée.</text><rect x="50" y="350" width="330" height="140" fill="#f3f2e9" stroke="#285646" stroke-width="3"/><text x="65" y="410" font-size="25">Accueil</text><path d="M380 420h50" stroke="#285646" stroke-width="4"/><rect x="430" y="350" width="330" height="140" fill="#f3f2e9" stroke="#285646" stroke-width="3"/><text x="445" y="410" font-size="25">Chambre 6</text><path d="M760 420h50" stroke="#285646" stroke-width="4"/><rect x="810" y="350" width="330" height="140" fill="#f3f2e9" stroke="#285646" stroke-width="3"/><text x="825" y="410" font-size="25">Parking arrière</text><text x="50" y="590" font-size="22">Les traits indiquent des passages, pas des distances. Les accès peuvent être condamnés</text><text x="50" y="622" font-size="22">par les conséquences jouées.</text><text x="50" y="760" font-size="15">DELTA GREEN · LES DOSSIERS DE LA PLUIE · DOCUMENT DE FICTION ORIGINAL</text></svg>