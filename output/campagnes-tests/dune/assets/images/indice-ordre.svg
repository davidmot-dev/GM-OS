<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#eee0c1"/><style>text{font-family:Georgia,serif;fill:#4a3424}</style><path d="M25 100H1175M25 725H1175" stroke="#94684b" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">I01 — L’ordre au sceau double</text><text x="55" y="155" font-size="22">Un ordre de transfert porte deux empreintes légèrement décalées. La Maison</text><text x="55" y="187" font-size="22">demande une vérification avant le départ.</text><text x="50" y="765" font-size="16">DUNE · NÉRÉIDE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>