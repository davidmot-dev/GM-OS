<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#e8e3d1"/><style>text{font-family:Georgia,serif;fill:#193c40}</style><path d="M25 100H1175M25 725H1175" stroke="#3c7178" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Le Cabinet des heures</text><text x="55" y="155" font-size="22">Un horloger conserve des pièces réformées. Les montres s’arrêtent lorsqu’on</text><text x="55" y="187" font-size="22">approche le même tiroir.</text><path d="M600 345L220 530" stroke="#3c7178" stroke-width="4"/><rect x="60" y="520" width="310" height="95" rx="12" fill="#c6d4ce" stroke="#3c7178"/><text x="75" y="570" font-size="18">Les Archives du canal</text><path d="M600 345L560 530" stroke="#3c7178" stroke-width="4"/><rect x="400" y="520" width="310" height="95" rx="12" fill="#c6d4ce" stroke="#3c7178"/><text x="415" y="570" font-size="18">La Serre des cinq eaux</text><ellipse cx="600" cy="345" rx="235" ry="60" fill="#c6d4ce" stroke="#3c7178"/><text x="415" y="350" font-size="21">Le Cabinet des heures</text><text x="55" y="675" font-size="22">Plan de recette sans échelle ; contexte occulte réglé au bandeau du meneur.</text><text x="50" y="765" font-size="16">NEPHILIM · LE MÉRIDIEN · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>