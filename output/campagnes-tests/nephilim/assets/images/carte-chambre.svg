<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#e8e3d1"/><style>text{font-family:Georgia,serif;fill:#193c40}</style><path d="M25 100H1175M25 725H1175" stroke="#3c7178" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">La Chambre du méridien</text><text x="55" y="155" font-size="22">Une lentille rassemble les reflets vers une plaque gravée. Un portrait change</text><text x="55" y="187" font-size="22">selon la lumière, sans révéler son nom.</text><path d="M600 345L220 530" stroke="#3c7178" stroke-width="4"/><rect x="60" y="520" width="310" height="95" rx="12" fill="#c6d4ce" stroke="#3c7178"/><text x="75" y="570" font-size="18">La Station de mesure</text><ellipse cx="600" cy="345" rx="235" ry="60" fill="#c6d4ce" stroke="#3c7178"/><text x="415" y="350" font-size="21">La Chambre du méridien</text><text x="55" y="675" font-size="22">Plan de recette sans échelle ; contexte occulte réglé au bandeau du meneur.</text><text x="50" y="765" font-size="16">NEPHILIM · LE MÉRIDIEN · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>