<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#e8e3d1"/><style>text{font-family:Georgia,serif;fill:#193c40}</style><path d="M25 100H1175M25 725H1175" stroke="#3c7178" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Astérion</text><text x="55" y="150" font-size="22">Conservateur de collections</text><text x="55" y="260" font-size="22">Un conservateur discret dont les doigts paraissent tièdes même dans les réserves</text><text x="55" y="292" font-size="22">froides.</text><text x="55" y="410" font-size="22">Une plaque de verre porte une écriture qu’il se souvient avoir tracée dans une</text><text x="55" y="442" font-size="22">autre incarnation.</text><text x="50" y="765" font-size="16">NEPHILIM · LE MÉRIDIEN · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>