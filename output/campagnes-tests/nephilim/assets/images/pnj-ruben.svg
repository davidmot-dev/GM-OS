<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#e8e3d1"/><style>text{font-family:Georgia,serif;fill:#193c40}</style><path d="M25 100H1175M25 725H1175" stroke="#3c7178" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Ruben Chassel</text><text x="55" y="155" font-size="22">Surveillant de chantier humain, inquiet des accès nocturnes.</text><text x="55" y="330" font-size="22">Je garde une porte, pas un laboratoire secret.</text><text x="50" y="765" font-size="16">NEPHILIM · LE MÉRIDIEN · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>