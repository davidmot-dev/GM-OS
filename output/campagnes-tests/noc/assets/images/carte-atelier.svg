<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="100%" height="100%" fill="#20262b"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#ece7d7}</style><path d="M22 100H1178M22 735H1178" stroke="#bf8d4e" stroke-width="3"/><text x="50" y="66" font-size="35" font-weight="700">Atelier des basses conduites</text><text x="55" y="150" font-size="22">Établis, pièces récupérées et conduites tièdes où s’appuyer pour reprendre souffle.</text><rect x="60" y="250" width="325" height="135" fill="#303d45" stroke="#bf8d4e" stroke-width="3"/><text x="78" y="302" font-size="25">1. Accès</text><path d="M385 316h55" stroke="#d6c79e" stroke-width="5"/><rect x="440" y="250" width="325" height="135" fill="#303d45" stroke="#bf8d4e" stroke-width="3"/><text x="458" y="302" font-size="25">2. Guichet / sas</text><path d="M765 316h55" stroke="#d6c79e" stroke-width="5"/><rect x="820" y="250" width="325" height="135" fill="#303d45" stroke="#bf8d4e" stroke-width="3"/><text x="838" y="302" font-size="25">3. Salle centrale</text><rect x="60" y="440" width="325" height="135" fill="#303d45" stroke="#bf8d4e" stroke-width="3"/><text x="78" y="492" font-size="25">4. Réserve</text><path d="M385 506h55" stroke="#d6c79e" stroke-width="5"/><rect x="440" y="440" width="325" height="135" fill="#303d45" stroke="#bf8d4e" stroke-width="3"/><text x="458" y="492" font-size="25">5. Maintenance</text><path d="M765 506h55" stroke="#d6c79e" stroke-width="5"/><rect x="820" y="440" width="325" height="135" fill="#303d45" stroke="#bf8d4e" stroke-width="3"/><text x="838" y="492" font-size="25">6. Issue</text><text x="55" y="670" font-size="22">Plan de recette sans échelle. La Loi décide des distances et de la portée effective</text><text x="55" y="702" font-size="22">des Auras.</text><text x="50" y="770" font-size="15">NOC · BLOC VESPER · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>