<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="100%" height="100%" fill="#20262b"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#ece7d7}</style><path d="M22 100H1178M22 735H1178" stroke="#bf8d4e" stroke-width="3"/><text x="50" y="66" font-size="35" font-weight="700">Carnet de destination</text><text x="55" y="150" font-size="22">Les convois détournés alimentent le dispositif d’Ozren. Les portes des captifs et la</text><text x="55" y="182" font-size="22">vanne d’isolement sont distinctes.</text><text x="50" y="770" font-size="15">NOC · BLOC VESPER · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>