<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="100%" height="100%" fill="#20262b"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#ece7d7}</style><path d="M22 100H1178M22 735H1178" stroke="#bf8d4e" stroke-width="3"/><text x="50" y="66" font-size="35" font-weight="700">Empreinte du timbre IX</text><text x="55" y="150" font-size="22">Le poinçon supplémentaire appartient au bureau des transferts. Ozren a signé sa</text><text x="55" y="182" font-size="22">sortie du coffre.</text><text x="50" y="770" font-size="15">NOC · BLOC VESPER · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>