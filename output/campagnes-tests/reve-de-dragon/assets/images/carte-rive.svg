<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f3ecd7"/><style>text{font-family:Georgia,serif;fill:#293f39}</style><path d="M25 100H1175M25 725H1175" stroke="#567963" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">La Rive des lanternes</text><text x="55" y="155" font-size="22">Des lanternes sans flamme jalonnent une eau immobile. Une barque transporte des</text><text x="55" y="187" font-size="22">paniers vides vers l’amont.</text><path d="M600 345L220 530" stroke="#567963" stroke-width="4"/><rect x="60" y="520" width="310" height="95" rx="20" fill="#d8e1cc" stroke="#567963"/><text x="75" y="570" font-size="20">L’Auberge des Trois Matins</text><path d="M600 345L560 530" stroke="#567963" stroke-width="4"/><rect x="400" y="520" width="310" height="95" rx="20" fill="#d8e1cc" stroke="#567963"/><text x="415" y="570" font-size="20">Le Pont qui résonne</text><path d="M600 345L900 530" stroke="#567963" stroke-width="4"/><rect x="740" y="520" width="310" height="95" rx="20" fill="#d8e1cc" stroke="#567963"/><text x="755" y="570" font-size="20">Le Verger des noms perdus</text><ellipse cx="600" cy="345" rx="230" ry="60" fill="#d8e1cc" stroke="#567963"/><text x="415" y="350" font-size="22">La Rive des lanternes</text><text x="55" y="675" font-size="22">Plan de fiction sans échelle ; la carte officielle des TMR est dans le module.</text><text x="50" y="765" font-size="16">RÊVE DE DRAGON · LE MOULIN · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>