<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f3ecd7"/><style>text{font-family:Georgia,serif;fill:#293f39}</style><path d="M25 100H1175M25 725H1175" stroke="#567963" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Liseron des Gués</text><text x="55" y="150" font-size="22">Voyageur, cartographe et haut-rêvant</text><text x="55" y="260" font-size="22">Manteau vert, carnet de routes et doigts tachés d’encre.</text><text x="55" y="410" font-size="22">Une route tracée hier disparaît de son carnet chaque matin. Il cherche la borne</text><text x="55" y="442" font-size="22">qui lui rendra son chemin.</text><text x="50" y="765" font-size="16">RÊVE DE DRAGON · LE MOULIN · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>