<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f3ecd7"/><style>text{font-family:Georgia,serif;fill:#293f39}</style><path d="M25 100H1175M25 725H1175" stroke="#567963" stroke-width="3"/><text x="50" y="67" font-size="34" font-weight="700">Céleste Verrière</text><text x="55" y="155" font-size="22">Meunière aux manches couvertes de farine grise.</text><text x="55" y="330" font-size="22">Laissez-leur une route, même s’ils ne reviennent pas.</text><text x="50" y="765" font-size="16">RÊVE DE DRAGON · LE MOULIN · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>