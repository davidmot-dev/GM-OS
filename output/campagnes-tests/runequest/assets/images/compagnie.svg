<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f3eee3"/><style>text{font-family:Georgia,serif;fill:#243f37}</style><path d="M25 100H1175M25 725H1175" stroke="#8d2029" stroke-width="3"/><text x="50" y="67" font-size="33" font-weight="700">Un passage pour trois familles</text><text x="55" y="170" font-size="22">Arven, Déléa et Koros : protéger les témoins, comprendre les copies et rendre</text><text x="55" y="202" font-size="22">l’eau au clos.</text><text x="55" y="340" font-size="22">Trois issues : accord négocié, preuves publiques ou réparation commune. La magie</text><text x="55" y="372" font-size="22">n’est jamais la clef unique.</text><text x="50" y="765" font-size="15">RUNEQUEST · LES BORNES DU GUÉ · DOCUMENT ORIGINAL DE RECETTE</text></svg>