<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f3eee3"/><style>text{font-family:Georgia,serif;fill:#243f37}</style><path d="M25 100H1175M25 725H1175" stroke="#8d2029" stroke-width="3"/><text x="50" y="67" font-size="33" font-weight="700">La parole d’Oren</text><text x="55" y="160" font-size="22">Oren a coupé la corde contre salaire et accepte de le dire si la table le</text><text x="55" y="192" font-size="22">protège d’une vendetta.</text><text x="50" y="765" font-size="15">RUNEQUEST · LES BORNES DU GUÉ · DOCUMENT ORIGINAL DE RECETTE</text></svg>