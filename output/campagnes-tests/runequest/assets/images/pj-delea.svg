<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f3eee3"/><style>text{font-family:Georgia,serif;fill:#243f37}</style><path d="M25 100H1175M25 725H1175" stroke="#8d2029" stroke-width="3"/><text x="50" y="67" font-size="33" font-weight="700">Déléa du Clos-Vert</text><text x="55" y="150" font-size="22">Éleveuse et soigneuse</text><text x="55" y="250" font-size="22">Mains tachées de plantes, mémoire précise des dettes et des bêtes perdues.</text><text x="55" y="410" font-size="22">Elle cherche sa sœur de lait, partie réparer une borne et revenue sans son sac.</text><text x="50" y="765" font-size="15">RUNEQUEST · LES BORNES DU GUÉ · DOCUMENT ORIGINAL DE RECETTE</text></svg>