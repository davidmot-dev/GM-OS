<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f3eee3"/><style>text{font-family:Georgia,serif;fill:#243f37}</style><path d="M25 100H1175M25 725H1175" stroke="#8d2029" stroke-width="3"/><text x="50" y="67" font-size="33" font-weight="700">Koros du Sceau-Fendu</text><text x="55" y="150" font-size="22">Scribe itinérant</text><text x="55" y="250" font-size="22">Tablettes enveloppées de laine, curieux des mots que les puissants omettent.</text><text x="55" y="410" font-size="22">Envoyé copier un accord de pâture ; il découvre que trois versions portent le</text><text x="55" y="442" font-size="22">même sceau.</text><text x="50" y="765" font-size="15">RUNEQUEST · LES BORNES DU GUÉ · DOCUMENT ORIGINAL DE RECETTE</text></svg>