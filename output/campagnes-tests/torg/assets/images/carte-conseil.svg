<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#17343e"/><rect x="25" y="25" width="1150" height="750" fill="none" stroke="#cbaa70" stroke-width="4"/><style>text{font-family:Arial,sans-serif;fill:#f2ead7}</style><text x="55" y="83" font-size="32" font-weight="700">La Maison des trois feux</text><path d="M55 110H1145M55 720H1145" stroke="#cbaa70" stroke-width="3"/><text x="55" y="165" font-size="22">Une salle municipale abrite le conseil des réfugiés, un dortoir et une cuisine. Chaque</text><text x="55" y="197" font-size="22">décision y engage des équipes de secours concrètes.</text><rect x="60" y="300" width="320" height="160" rx="8" fill="#254953" stroke="#cbaa70" stroke-width="3"/><text x="78" y="365" font-size="25">Salle du conseil</text><path d="M380 380h60" stroke="#cbaa70" stroke-width="6"/><rect x="440" y="300" width="320" height="160" rx="8" fill="#254953" stroke="#cbaa70" stroke-width="3"/><text x="458" y="365" font-size="25">Cuisine refuge</text><path d="M760 380h60" stroke="#cbaa70" stroke-width="6"/><rect x="820" y="300" width="320" height="160" rx="8" fill="#254953" stroke="#cbaa70" stroke-width="3"/><text x="838" y="365" font-size="25">Atelier radio</text><text x="55" y="520" font-size="22">Vers : Port-Serein · Le Dépôt des heures · Le Pont des Verrières</text><text x="55" y="635" font-size="22">Cosm annoncé : prime-terre. Schéma sans échelle ; le MJ annonce distances et accès.</text><text x="55" y="757" font-size="15">TORG · LES BALISES DE L’AUBE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>