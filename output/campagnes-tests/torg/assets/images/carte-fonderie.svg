<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#17343e"/><rect x="25" y="25" width="1150" height="750" fill="none" stroke="#cbaa70" stroke-width="4"/><style>text{font-family:Arial,sans-serif;fill:#f2ead7}</style><text x="55" y="83" font-size="32" font-weight="700">La Fonderie de cendre</text><path d="M55 110H1145M55 720H1145" stroke="#cbaa70" stroke-width="3"/><text x="55" y="165" font-size="22">Des cages de transport, une infirmerie improvisée et une galerie de refroidissement</text><text x="55" y="197" font-size="22">entourent une chaîne d’assemblage. La nourriture et les clés sont deux leviers</text><text x="55" y="229" font-size="22">distincts.</text><rect x="60" y="300" width="320" height="160" rx="8" fill="#254953" stroke="#cbaa70" stroke-width="3"/><text x="78" y="365" font-size="25">Cages</text><path d="M380 380h60" stroke="#cbaa70" stroke-width="6"/><rect x="440" y="300" width="320" height="160" rx="8" fill="#254953" stroke="#cbaa70" stroke-width="3"/><text x="458" y="365" font-size="25">Infirmerie</text><path d="M760 380h60" stroke="#cbaa70" stroke-width="6"/><rect x="820" y="300" width="320" height="160" rx="8" fill="#254953" stroke="#cbaa70" stroke-width="3"/><text x="838" y="365" font-size="25">Refroidissement</text><text x="55" y="520" font-size="22">Vers : La Voie suspendue · Le Carrefour des balises</text><text x="55" y="635" font-size="22">Cosm annoncé : tharkold. Schéma sans échelle ; le MJ annonce distances et accès.</text><text x="55" y="757" font-size="15">TORG · LES BALISES DE L’AUBE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>