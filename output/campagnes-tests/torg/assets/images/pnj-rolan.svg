<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#17343e"/><rect x="25" y="25" width="1150" height="750" fill="none" stroke="#cbaa70" stroke-width="4"/><style>text{font-family:Arial,sans-serif;fill:#f2ead7}</style><text x="55" y="83" font-size="32" font-weight="700">Rolan du convoi</text><path d="M55 110H1145M55 720H1145" stroke="#cbaa70" stroke-width="3"/><text x="55" y="165" font-size="22">Garde du hangar</text><text x="55" y="255" font-size="22">Objectif : Garder sa place dans le convoi sans mourir pour Varda.</text><text x="55" y="385" font-size="22">Attitude : Une voie de retrait sûre le pousse à abandonner son poste.</text><text x="55" y="600" font-size="22">Cartouche documentaire original ; aucun portrait illustré ou profil officiel</text><text x="55" y="632" font-size="22">revendiqué.</text><text x="55" y="757" font-size="15">TORG · LES BALISES DE L’AUBE · FICTION ORIGINALE DE RECETTE GM-OS</text></svg>