<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#eee8dc"/><path d="M24 28h1115l37 30v52H24z" fill="#080b26"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#101528}</style><text x="52" y="81" font-size="29" style="fill:#fff6e5">Orée — dépôt des dossiers</text><text x="55" y="155" font-size="22">Annexe d’archives sur une petite lune. Le dépôt est froid, sans personnel permanent</text><text x="55" y="187" font-size="22">; ses portes sont encore sous contrat de maintenance.</text><rect x="60" y="360" width="320" height="175" fill="#ded9ce" stroke="#7a4918" stroke-width="3"/><text x="74" y="410" font-size="22">1. Sas hors tension</text><rect x="440" y="360" width="320" height="175" fill="#ded9ce" stroke="#7a4918" stroke-width="3"/><text x="454" y="410" font-size="22">2. Salle des</text><text x="454" y="442" font-size="22">registres</text><rect x="820" y="360" width="320" height="175" fill="#ded9ce" stroke="#7a4918" stroke-width="3"/><text x="834" y="410" font-size="22">3. Antenne de secours</text><path d="M380 447h60M760 447h60" stroke="#080b26" stroke-width="4"/><text x="55" y="610" font-size="22">Plan de situation sans échelle. Le MJ fixe accès, distances, couvert et dangers</text><text x="55" y="642" font-size="22">avant les jets. Les traits sont des liaisons possibles, pas des portes</text><text x="55" y="674" font-size="22">automatiques.</text><path d="M50 719h1100" stroke="#7a4918" stroke-width="2"/><text x="54" y="755" font-size="15">TRAVELLER · LA PART DES ABSENTS · FICTION ORIGINALE · SCHÉMA / DOCUMENT, PAS PHOTOGRAPHIE</text></svg>