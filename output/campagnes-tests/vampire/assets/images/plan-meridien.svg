<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f6f0e8"/><path d="M28 110V48l20-20h1104l20 20v704l-20 20H48l-20-20V135" stroke="#990f32" fill="none" stroke-width="2"/><style>text{font-family:Georgia,serif;fill:#282128}</style><text x="55" y="82" font-size="31">La tour Méridien</text><text x="55" y="150" font-size="22">Un bâtiment de bureaux avec serveur de sauvegarde et contrats papier. Les agents de</text><text x="55" y="182" font-size="22">sécurité disposent d’une consigne de retrait. Plan schématique original, sans échelle.</text><rect x="70" y="320" width="290" height="116" fill="#e6ddd7" stroke="#990f32" stroke-width="2"/><text x="82" y="374" font-size="21">1. Hall et contrôle</text><rect x="455" y="320" width="290" height="116" fill="#e6ddd7" stroke="#990f32" stroke-width="2"/><text x="467" y="374" font-size="21">2. Archives privées</text><rect x="840" y="465" width="290" height="116" fill="#e6ddd7" stroke="#990f32" stroke-width="2"/><text x="852" y="519" font-size="21">3. Serveur / escalier</text><path d="M360 378H408V378h47M745 378h48V523h47" fill="none" stroke="#990f32" stroke-width="3"/><text x="55" y="646" font-size="22">Passages indicatifs. Annoncer les distances, les accès et les issues avant une action</text><text x="55" y="678" font-size="22">risquée ; aucun effet automatique de terrain.</text><path d="M55 715h1090" stroke="#990f32"/><text x="55" y="753" font-family="Arial,sans-serif" font-size="14">VAMPIRE V5 · VALOMBRE / LE REGISTRE DES ABSENTS · FICTION ORIGINALE GM-OS</text></svg>